name: flowproj
description: "FlowProj - geteasy"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  provider: ^6.1.2
  get_it: ^7.7.0
  go_router: ^13.2.5

  # Supabase
  supabase_flutter: ^2.5.0

  # UI
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Environment
  flutter_dotenv: ^5.1.0

  # Universal
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env